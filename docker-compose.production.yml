# Supply TLS_CERT_PATH and TLS_KEY_PATH pointing to valid certificate/key files on the host.
services:
  backend:
    environment:
      COOKIE_SECURE: "true"
  worker:
    environment:
      COOKIE_SECURE: "true"
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:?Set TLS_CERT_PATH}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_KEY_PATH:?Set TLS_KEY_PATH}:/etc/nginx/tls/privkey.pem:ro
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped
